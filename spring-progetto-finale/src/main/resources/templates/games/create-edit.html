<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <th:block
    th:if="${game}"
    th:replace="~{fragments/fragment :: header(${edit} ? 'Edit ' + ${game?.name} : 'Add new game')}"
  >
  </th:block>
  <th:block
    th:unless="${game}"
    th:replace="~{fragments/fragment :: header('Not found')}"
  >
  </th:block>

  <body>
    <header>
      <th:block th:replace="~{fragments/fragment :: navbar}"> </th:block>
    </header>

    <main class="container pt-5 my-5">
      <h1 th:if="${!edit}" class="my-5 text-center">Add a new game</h1>
      <h1 th:if="${edit}" class="my-5 text-center">Edit [[${game?.name}]]</h1>

      <div th:if="${game}" class="d-flex justify-content-center">
        <th:block
          th:replace="~{fragments/fragment :: createEditGamesForm(${edit ? '/edit/' + game.id : '/create'}, ${edit})}"
        ></th:block>
      </div>

      <div th:unless="${game}">
        <h1 class="text-center fw-bold text-danger">Game not found!</h1>
      </div>
    </main>
  </body>
</html>
