<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <th:block th:fragment="header(title)">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title th:text="${title}"></title>
      <link
        rel="stylesheet"
        th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"
      />
      <link rel="stylesheet" th:href="@{/card.css}">
    </head>
  </th:block>

  <body>


    <th:block th:fragment="navbar">
      <nav class="navbar navbar-expand-lg bg-body-tertiary position-fixed w-100 z-1 top-0" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand fw-bold fs-2" href="#">Checpoint Store</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" th:href="@{/}">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" th:href="@{/genres}" sec:authorize="hasAuthority('ADMIN')"
                >Genres</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" th:href="@{/consoles}">Consoles</a>
              </li>

              
            </ul>

            <form th:action="@{/search}" class="d-flex" role="search">
              <input class="form-control me-2" name="search" type="search" placeholder="Search by game name" aria-label="Search"/>
              <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
            <a class="btn btn-danger ms-3" href="/logout">Logout</a>
          </div>
        </div>
      </nav>
    </th:block>


    <th:block th:fragment="createEditGamesForm(action, edit)">
        <div class="border border-2 w-75 rounded-4 p-4 mb-5 border-dark">
          <form
            th:action="@{${action}}"
            th:object="${game}"
            enctype="multipart/form-data"
            method="post"
          >
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
              <label for="name" class="form-label fw-bold">Name</label>
              <input
                type="text"
                class="form-control"
                th:errorClass="is-invalid"
                placeholder="The Last of Us Part I"
                id="name"
                th:field="*{name}"
              />

              <div
                th:if="${#fields.hasErrors('name')}"
                class="invalid-feedback"
              >
                <ul>
                  <li th:each="error : ${#fields.errors('name')}">
                    [[${error}]]
                  </li>
                </ul>
              </div>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label fw-bold"
                >Description</label
              >
              <textarea
                class="form-control"
                th:errorClass="is-invalid"
                placeholder="Experience Joel and Ellie's adventure in search of a cure for the Cordyceps"
                id="description"
                th:field="*{description}"
              ></textarea>

              <div
                th:if="${#fields.hasErrors('description')}"
                class="invalid-feedback"
              >
                <ul>
                  <li th:each="error : ${#fields.errors('description')}">
                    [[${error}]]
                  </li>
                </ul>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">
                  Genre
              </label>

              <div th:each="genre : ${genresList}">
                  <input
                      type="checkbox"
                      class="form-check-input"
                      th:id="'genre-' + ${genre.id}"
                      th:value="${genre.id}"
                      th:field="*{genres}"
                  />

                  <label
                      class="form-check-label"
                      th:for="'genre-' + ${genre.id}"
                      th:text="${genre.name}"
                  ></label>
              </div>

              <div
                  th:if="${#fields.hasErrors('genres')}"
                  class="text-danger"
              >
                  <ul>
                      <li th:each="error : ${#fields.errors('genres')}"
                          th:text="${error}">
                      </li>
                  </ul>
              </div>
            </div>

            <div class="mb-3">
              <label for="exampleFormControlInput1" class="form-label fw-bold"
                >Available on</label
              >

              <div>
                <div
                  class="block"
                  th:each="console : ${consolesList}"
                >
                  <input
                    type="checkbox"
                    class="form-check-input"
                    th:id="${console.name}"
                    th:value="${console.id}"
                    th:field="*{availableConsoles}"
                  />
                  <label th:for="${console.name}">[[${console.name}]]</label>
                </div>
              </div>

              <div
                  th:if="${#fields.hasErrors('availableConsoles')}"
                  class="text-danger"
              >
                  <ul>
                      <li th:each="error : ${#fields.errors('availableConsoles')}"
                          th:text="${error}">
                      </li>
                  </ul>
              </div>
            </div>

            <div class="mb-3">
              <label for="exampleFormControlInput1" class="form-label fw-bold"
                >Developer</label
              >
              <input
                type="text"
                class="form-control"
                th:errorClass="is-invalid"
                placeholder="Naughty dog"
                id="developer"
                th:field="*{developer}"
              />

              <div
                th:if="${#fields.hasErrors('developer')}"
                class="invalid-feedback"
              >
                <ul>
                  <li th:each="error : ${#fields.errors('developer')}">
                    [[${error}]]
                  </li>
                </ul>
              </div>
            </div>

            <div class="mb-3">
              <label for="publisher" class="form-label fw-bold"
                >Publisher</label
              >
              <input
                type="text"
                class="form-control"
                th:errorClass="is-invalid"
                placeholder="Naughty dog"
                id="publisher"
                th:field="*{publisher}"
              />

              <div
                th:if="${#fields.hasErrors('publisher')}"
                class="invalid-feedback"
              >
                <ul>
                  <li th:each="error : ${#fields.errors('publisher')}">
                    [[${error}]]
                  </li>
                </ul>
              </div>
            </div>

            <div class="mb-3">
              <label for="cover" class="form-label fw-bold">Cover image</label>
              <input
                type="file"
                class="form-control"
                id="cover"
                name="coverImage"
                accept="image/.jpg"
              />
              <div
                  th:if="${#fields.hasErrors('image')}"
                  class="text-danger"
              >
                  <ul>
                      <li th:each="error : ${#fields.errors('image')}"
                          th:text="${error}">
                      </li>
                  </ul>
              </div>
            </div>

            <div class="mb-3">
              <label for="price" class="form-label fw-bold">Price</label>
              <input
                type="number"
                step="0.01"
                class="form-control"
                th:errorClass="is-invalid"
                placeholder="69.99"
                id="publisher"
                th:field="*{price}"
              />

              <div
                th:if="${#fields.hasErrors('price')}"
                class="invalid-feedback"
              >
                <ul>
                  <li th:each="error : ${#fields.errors('price')}">
                    [[${error}]]
                  </li>
                </ul>
              </div>
            </div>

            <div class="w-100">
              <button th:if="${edit}" class="btn btn-success w-100 fw-bold" type="submit">
                Edit [[*{name}]]
              </button>
              <button th:unless="${edit}" class="btn btn-success w-100 fw-bold" type="submit">
                Add new game
              </button>
            </div>
          </form>
        </div>
    </th:block>
    <th:block th:fragment="createEditGenresForm(action, edit)">
        <div class="border border-2 w-75 rounded-4 p-4 mb-5 border-dark">
          <form
            th:action="@{${action}}"
            th:object="${genre}"
            method="post"
          >
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{games}" />

            <div class="mb-3">
              <label for="name" class="form-label fw-bold">Name</label>
              <input
                type="text"
                class="form-control"
                th:errorClass="is-invalid"
                placeholder="Action"
                id="name"
                th:field="*{name}"
              />

              <div
                th:if="${#fields.hasErrors('name')}"
                class="invalid-feedback"
              >
                <ul>
                  <li th:each="error : ${#fields.errors('name')}">
                    [[${error}]]
                  </li>
                </ul>
              </div>
            </div>

            

            <div class="w-100">
              <button th:if="${edit}" class="btn btn-success w-100 fw-bold" type="submit">
                Edit [[*{name}]]
              </button>
              <button th:unless="${edit}" class="btn btn-success w-100 fw-bold" type="submit">
                Add new genre
              </button>
            </div>
          </form>
        </div>
    </th:block>

    <th:block th:fragment="createEditConsolesForm(action, edit)">
        <div class="border border-2 w-75 rounded-4 p-4 mb-5 border-dark">
          <form
            th:action="@{${action}}"
            th:object="${console}"
            method="post"
          >
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{games}" />

            <div class="mb-3">
              <label for="name" class="form-label fw-bold">Name</label>
              <input
                type="text"
                class="form-control"
                th:errorClass="is-invalid"
                placeholder="Playstation 5"
                id="name"
                th:field="*{name}"
              />

              <div
                th:if="${#fields.hasErrors('name')}"
                class="invalid-feedback"
              >
                <ul>
                  <li th:each="error : ${#fields.errors('name')}">
                    [[${error}]]
                  </li>
                </ul>
              </div>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label fw-bold"
                >Description</label
              >
              <textarea
                class="form-control"
                th:errorClass="is-invalid"
                placeholder="Sony home console featuring high performance, fast loading times and support for modern games with advanced graphics"
                id="description"
                th:field="*{description}"
              ></textarea>

              <div
                th:if="${#fields.hasErrors('description')}"
                class="invalid-feedback"
              >
                <ul>
                  <li th:each="error : ${#fields.errors('description')}">
                    [[${error}]]
                  </li>
                </ul>
              </div>
            </div>


            <div class="mb-3">
              <label for="price" class="form-label fw-bold">Price</label>
              <input
                type="number"
                step="0.01"
                class="form-control"
                th:errorClass="is-invalid"
                placeholder="549.90"
                id="price"
                th:field="*{price}"
              />

              <div
                th:if="${#fields.hasErrors('price')}"
                class="invalid-feedback"
              >
                <ul>
                  <li th:each="error : ${#fields.errors('price')}">
                    [[${error}]]
                  </li>
                </ul>
              </div>
            </div>

            

            <div class="w-100">
              <button th:if="${edit}" class="btn btn-success w-100 fw-bold" type="submit">
                Edit [[*{name}]]
              </button>
              <button th:unless="${edit}" class="btn btn-success w-100 fw-bold" type="submit">
                Add new console
              </button>
            </div>
          </form>
        </div>
    </th:block>

  </body>
</html>
