<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
  <meta charset="UTF-8">
  <title>Login</title>
        <link
        rel="stylesheet"
        th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"
      />
</head>

  <body>
    <header>
      <th:block th:replace="~{fragments/fragment :: navbar}"></th:block>
    </header>

    <main class="container text-center my-5 pt-5">
      <div class="d-flex justify-content-center mt-5">
        <form
        th:action="@{/login}"
          method="post"
          class="w-25 border border-2 border-dark rounded p-3"
        >

            <div
              class="alert alert-warning alert-dismissible fade show d-flex align-items-center justify-content-center"
              role="alert"
              th:if="${param.error}"
            >
              <i class="bi bi-exclamation-triangle-fill me-2"></i>

              <div class="fw-bold">Login failed. Try again.</div>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close"
              ></button>
            </div>

            <div
              class="alert alert-warning alert-dismissible fade show d-flex align-items-center justify-content-center"
              role="alert"
              th:if="${param.logout}"
            >
              <i class="bi bi-exclamation-triangle-fill me-2"></i>

              <div class="fw-bold">You've been logged out.</div>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close"
              ></button>
            </div>

          <div class="mb-3">
            <label htmlFor="username" class="form-label fw-bold">
              Username
            </label>
            <input
              type="text"
              class="form-control"
              placeholder="username"
              name="username"
              id="username"
              required
            />
          </div>

          <div class="mb-3">
            <label htmlFor="password" class="form-label fw-bold">
              Password
            </label>
            <input
              type="password"
              class="form-control"
              placeholder="password"
              name="password"
              id="password"
              required
            />
          </div>

          <div class="w-100">
            <button class="btn btn-dark w-100 fw-bold" type="submit">
              Login
            </button>
          </div>


        </form>
    </main>
    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
